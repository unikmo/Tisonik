<style>

<body><div id="root"></div>
<script>
(function(){
  'use strict'
  var root=document.getElementById('root')
  var match=/[#&]t=([^&]+)/.exec(location.hash)
  var token=match?match[1]:undefined
  var state=null,tab='today',cache={inbox:null,people:null,pending:0},today={pulses:{},recognised:{}}
  var again='Scan your card again, or open this page from the app, to continue.'

  function el(tag,attrs,kids){var n=document.createElement(tag);for(var k in (attrs||{})){if(k==='text')n.textContent=attrs[k];else if(attrs[k]!==false&&attrs[k]!=null)n.setAttribute(k,attrs[k])}(kids||[]).forEach(function(c){if(c==null||c===false)return;n.appendChild(typeof c==='string'?document.createTextNode(c):c)});return n}
  function api(path,body){return fetch('/api/v1/stays/'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json().catch(function(){return{}}).then(function(j){return{status:r.status,body:j}})})}
  function connect(action,data){return api('connect',{token:token,action:action,data:data||{}})}

  // Static icon markup only. Nothing a guest or a venue writes ever goes through innerHTML.
  var P={
    today:'<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/>',
    people:'<circle cx="9" cy="8" r="3.2"/><path d="M3 19c.6-3.3 3-5 6-5s5.4 1.7 6 5"/><circle cx="17.2" cy="9" r="2.4"/><path d="M17 14c2.3.2 3.7 1.6 4.2 4.2"/>',
    crew:'<path d="m12 3 2.6 5.4 5.9.8-4.3 4.2 1 5.9L12 16.4 6.8 19.3l1-5.9L3.5 9.2l5.9-.8z"/>',
    rate:'<path d="M4 19V9m6 10V5m6 14v-7m4 7H3"/>',
    help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.3a2.6 2.6 0 0 1 5 .9c0 1.8-2.5 2.2-2.5 3.8"/><path d="M12 17.2h.01"/>',
    check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
    play:'<path d="M8 5.5v13l11-6.5z" fill="currentColor"/>',
    more:'<circle cx="5" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="19" cy="12" r="1.4" fill="currentColor"/>',
    key:'<rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h5"/>',
    compass:'<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/>',
    heart:'<path d="M12 20s-7.5-4.4-7.5-10A4.3 4.3 0 0 1 12 7.6 4.3 4.3 0 0 1 19.500 10c0 5.600-7.500 10-7.500 10z"/>'
  }
  function icon(name,size){var s=document.createElement('span');s.setAttribute('aria-hidden','true');s.innerHTML='<svg width="'+(size||24)+'" height="'+(size||24)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(P[name]||'')+'</svg>';return s}

  var AV={coral:['#ff8a73','#e2533f'],amber:['#ffc15a','#e08a1e'],sand:['#d9bf8e','#a8803f'],sage:['#a0c996','#5a9566'],teal:['#5fc9c0','#1f7f7b'],sky:['#86c2ff','#3577cf'],indigo:['#939bff','#4650c4'],plum:['#cc84df','#85389f'],rose:['#ff96b3','#cf416a'],slate:['#9eabba','#56657a'],olive:['#bfca70','#74842a'],ink:['#5a6980','#1a2333']}
  function avatar(key,name,size){var c=AV[key]||AV.slate;var a=el('span',{class:'avatar'+(size?' '+size:''),'aria-hidden':'true',text:String(name||'?').trim().charAt(0).toUpperCase()});a.style.background='linear-gradient(145deg,'+c[0]+','+c[1]+')';return a}

  var toastTimer
  function toast(text){var old=document.querySelector('.toast');if(old)old.remove();var t=el('div',{class:'toast',role:'status',text:text});document.body.appendChild(t);clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.remove()},3200)}

  // Bottom sheet with a focus trap, Escape to close and focus returned to the button that opened it.
  function sheet(title,build){
    var opener=document.activeElement,old=document.querySelector('.toast');if(old)old.remove()

    box.focus()
    return close
  }

  function tabsFor(){
    var t=state.tiles,f=state.features,list=[{id:'today',label:'Today',icon:'today'}]

    if(f.recognition||t.thankYou)list.push({id:'crew',label:state.venueType==='ship'?'Crew':'Team',icon:'crew'})
    if(f.pulse||t.rating)list.push({id:'rate',label:'Rate',icon:'rate'})
    if(t.private||t.feedback)list.push({id:'help',label:'Help',icon:'help'})
    return list
  }

  function shell(view,heading,sub){
    root.innerHTML=''
    var ship=state.venueType==='ship'
    var tabs=tabsFor()
    var nav=el('nav',{class:'tabs','aria-label':'Sections'},[el('ul',{},tabs.map(function(x){
      var b=el('button',{type:'button',class:'tab','aria-current':x.id===tab?'page':false},[icon(x.icon,24),el('span',{text:x.label})])

    var edit=el('button',{type:'button',class:'btn small ghost',text:'Edit'});edit.addEventListener('click',function(){profileSheet(p)})
    head.appendChild(edit);v.appendChild(el('section',{class:'card flat'},[head]))
    var box=el('section',{class:'card'});v.appendChild(box)

  }
  function profileCard(p){
    var c=el('section',{class:'card'},[el('p',{class:'kicker',text:'Optional'}),el('h2',{text:'Meet people on board'}),el('p',{class:'lead',text:'Say hello to guests who share your interests. You choose a first name and an avatar. Nothing else about you is shown.'})])
    c.appendChild(el('ul',{class:'rules'},[
      el('li',{},[icon('check',18),el('span',{text:'Preset compliments only. There is no chat and no dating.'})]),
      el('li',{},[icon('check',18),el('span',{text:'Meet-ups are suggested for public places only. Never a cabin.'})]),
      el('li',{},[icon('check',18),el('span',{text:'Only guests who opted in on this sailing can see you. Block or report anyone, any time.'})])]))
    var b=el('button',{type:'button',class:'btn block',style:'margin-top:18px',text:p?'Turn visibility back on':'Set up my profile'});b.addEventListener('click',function(){profileSheet(p)});c.appendChild(b)

  }
  function profileSheet(existing){
    sheet(existing?'Your profile':'Set up your profile',function(body,close){
      var name=el('input',{type:'text',id:'pf-name',maxlength:'24',autocomplete:'off',placeholder:'First name',value:existing?existing.name:''})
      var avKey=existing?existing.avatar:'coral',interests=(existing?existing.interests:[]).slice()
      body.appendChild(el('label',{class:'field','for':'pf-name',text:'First name (shown to other guests)'}));body.appendChild(name)
      body.appendChild(el('p',{class:'field',style:'margin-bottom:8px',text:'Avatar'}))
      var sw=el('div',{class:'swatches',role:'radiogroup','aria-label':'Avatar'})
      state.connect.avatars.forEach(function(k){var b=el('button',{type:'button',class:'swatch',role:'radio','aria-checked':String(k===avKey),'aria-label':k},[avatar(k,name.value||'A','sm')]);b.addEventListener('click',function(){avKey=k;sw.querySelectorAll('.swatch').forEach(function(s){s.setAttribute('aria-checked',String(s===b))})});sw.appendChild(b)})
      name.addEventListener('input',function(){sw.querySelectorAll('.avatar').forEach(function(a){a.textContent=(name.value.trim().charAt(0)||'A').toUpperCase()})})
      body.appendChild(sw)
      body.appendChild(el('p',{class:'field',style:'margin-bottom:8px',text:'Interests you are happy to share'}))
      var chips=el('div',{class:'chips',role:'group','aria-label':'Interests'})
      state.connect.interests.forEach(function(i){var b=el('button',{type:'button',class:'chip','aria-pressed':String(interests.indexOf(i.id)>=0),text:i.label});b.addEventListener('click',function(){var at=interests.indexOf(i.id);if(at>=0)interests.splice(at,1);else interests.push(i.id);b.setAttribute('aria-pressed',String(interests.indexOf(i.id)>=0))});chips.appendChild(b)})
      body.appendChild(chips)
      var near=el('input',{type:'checkbox',id:'pf-near'});near.checked=existing?!!existing.nearby:false
      var plans=el('input',{type:'checkbox',id:'pf-plans'});plans.checked=existing?!!existing.sharePlans:false
      var adult=el('input',{type:'checkbox',id:'pf-adult'});if(existing)adult.checked=true
      var show=el('input',{type:'checkbox',id:'pf-show'});show.checked=existing?existing.discoverable:true
      body.appendChild(el('label',{class:'check','for':'pf-adult'},[adult,el('span',{text:'I am 18 or over.'})]))
      body.appendChild(el('label',{class:'check','for':'pf-show'},[show,el('span',{text:'Show me to other guests on this sailing.'})]))
      body.appendChild(el('label',{class:'check','for':'pf-near'},[near,el('span',{text:'Also show me to guests close by. This works through the ship\u2019s app: no map, no distance.'})]))
      body.appendChild(el('label',{class:'check','for':'pf-plans'},[plans,el('span',{text:'Let guests I have met see which offers I am going to.'})]))
      var msg=el('p',{class:'msg',role:'status'}),save=el('button',{type:'button',class:'btn block',style:'margin-top:16px',text:existing?'Save':'Join'})
      body.appendChild(save);body.appendChild(msg)
      save.addEventListener('click',function(){
        if(!name.value.trim()){msg.className='msg bad';msg.textContent='Please add a first name.';return}
        if(!adult.checked){msg.className='msg bad';msg.textContent='This is for guests aged 18 or over.';return}
        save.disabled=true
        connect('profile.save',{displayName:name.value.trim(),avatar:avKey,interests:interests,adult:true,discoverable:show.checked,nearby:near.checked,sharePlans:plans.checked}).then(function(res){
          if(res.status===200){state.profile=res.body.profile;cache.people=null;cache.inbox=null;close();toast(show.checked?'You are on the list.':'You are hidden.');render();refreshPending()}
          else{save.disabled=false;msg.className='msg bad';msg.textContent=res.status===422?'Names can not include numbers, links or contact details.':'That did not save. Please try again.'}
        }).catch(function(){save.disabled=false;msg.className='msg bad';msg.textContent='That did not save. Please try again.'})
      })
    })
  }
  var filter=null,how='interests',actId=null
  function loadPeople(box){
    var labelOf={};state.connect.interests.forEach(function(i){labelOf[i.id]=i.label})
    var acts=state.connect.activities||[]
    var hows=[['interests','By interest'],['nearby','Nearby']];if(acts.length)hows.push(['activity','Same activity'])
    var modes=el('div',{class:'chips',style:'margin-bottom:12px',role:'group','aria-label':'How to find people'})
    hows.forEach(function(h){var b=el('button',{type:'button',class:'chip','aria-pressed':String(how===h[0]),text:h[1]});b.addEventListener('click',function(){how=h[0];render()});modes.appendChild(b)})
    box.appendChild(modes)
    var body=el('div');box.appendChild(body)
    function empty(title,text,extra){body.innerHTML='';body.appendChild(el('div',{class:'empty'},[el('b',{text:title}),el('span',{text:text}),extra||null]))}
    var data={}
    if(how==='interests'&&filter)data.interest=filter
    if(how==='nearby')data.mode='nearby'
    if(how==='activity'){
      if(!actId)actId=acts[0].id
      var pick=el('div',{class:'chips',style:'margin-bottom:12px',role:'group','aria-label':'Activity'})
      acts.forEach(function(a){var b=el('button',{type:'button',class:'chip','aria-pressed':String(actId===a.id),text:a.title+(a.when?' · '+a.when:'')});b.addEventListener('click',function(){actId=a.id;render()});pick.appendChild(b)})
      body.appendChild(pick);data.activity=actId
    }else if(how==='interests'){
      var chips=el('div',{class:'chips',style:'margin-bottom:12px',role:'group','aria-label':'Filter by interest'})
      var all=el('button',{type:'button',class:'chip','aria-pressed':String(!filter),text:'Everyone'});all.addEventListener('click',function(){filter=null;render()});chips.appendChild(all)
      state.connect.interests.forEach(function(i){var b=el('button',{type:'button',class:'chip','aria-pressed':String(filter===i.id),text:i.label});b.addEventListener('click',function(){filter=i.id;render()});chips.appendChild(b)})
      body.appendChild(chips)
    }
    var list=el('div');body.appendChild(list)
    list.appendChild(el('p',{class:'sub',text:'Loading guests...'}))
    connect('people.list',data).then(function(res){
      list.innerHTML=''
      if(res.status!==200){list.appendChild(el('div',{class:'empty'},[el('b',{text:'We could not load guests'}),el('span',{text:'Please try again in a moment.'})]));return}
      if(how==='nearby'&&res.body.nearbyReady===false){
        var turn=el('button',{type:'button',class:'btn small ghost',style:'margin-top:12px',text:state.profile.nearby?'Open my profile':'Turn on Nearby'});turn.addEventListener('click',function(){profileSheet(state.profile)})
        list.appendChild(el('div',{class:'empty'},[el('b',{text:'No Nearby signal yet'}),el('span',{text:state.profile.nearby?'Open the ship’s app on this phone and keep it open. Guests close by appear here, with no map and no distance.':'Nearby shows guests close to you right now, with no map and no distance. It works through the ship’s app.'}),turn]));return
      }
      if(how==='activity'&&res.body.joined===false){
        var join=el('button',{type:'button',class:'btn small',style:'margin-top:12px',text:'I took part today'});join.addEventListener('click',function(){join.disabled=true;connect('activity.join',{activityId:actId}).then(function(){toast('Noted.');render()})})
        list.appendChild(el('div',{class:'empty'},[el('b',{text:'Were you there?'}),el('span',{text:'Tell us you took part and you will see other guests who did too.'}),join]));return
      }
      var people=res.body.people
      if(!people.length){list.appendChild(el('div',{class:'empty'},[el('b',{text:how==='nearby'?'No one close by right now':how==='activity'?'No one else has joined yet':filter?'No one with that interest yet':'No one else is visible yet'}),el('span',{text:'More guests join each day. Check back soon.'})]));return}
      people.forEach(function(x){
        var txt=(x.shared.length?x.shared:x.interests).map(function(s){return labelOf[s]||s}).join(' · ')
        var common=x.shared.length?el('span',{class:'pill ok',text:x.shared.length+' in common'}):null
        var send=el('button',{type:'button',class:'btn small',disabled:x.sentToday?'':false,text:x.sentToday?'Sent today':'Compliment'})
        if(!x.sentToday)send.addEventListener('click',function(){complimentSheet(x)})
        var more=el('button',{type:'button',class:'more','aria-label':'More options for '+x.name},[icon('more',22)]);more.addEventListener('click',function(){safetySheet(x)})
        list.appendChild(el('div',{class:'person'},[avatar(x.avatar,x.name),el('div',{class:'grow'},[el('strong',{text:x.name}),common,txt?el('span',{class:'sub',text:txt}):null]),send,more]))
      })
    }).catch(function(){list.innerHTML='';list.appendChild(el('div',{class:'empty'},[el('b',{text:'We could not load guests'}),el('span',{text:'Please try again in a moment.'})]))})
  }
  function complimentSheet(x){
    sheet('Compliment '+x.name,function(body,close){
      var label=null,msg=el('p',{class:'msg',role:'status'})
      body.appendChild(el('p',{class:'sub',text:'Pick one. '+x.name+' can say thanks or pass. Nothing else is shared.'}))
      var chips=el('div',{class:'chips',style:'margin-top:14px',role:'radiogroup','aria-label':'Compliment'})
      state.connect.affirmations.forEach(function(a){var b=el('button',{type:'button',class:'chip',role:'radio','aria-checked':'false',text:a.label});b.addEventListener('click',function(){label=a.id;chips.querySelectorAll('.chip').forEach(function(c){c.setAttribute('aria-checked',String(c===b))})});chips.appendChild(b)})
      var send=el('button',{type:'button',class:'btn block',style:'margin-top:18px',text:'Send'})
      body.appendChild(chips);body.appendChild(send);body.appendChild(msg)
      send.addEventListener('click',function(){
        if(!label){msg.className='msg bad';msg.textContent='Choose a compliment first.';return}
        send.disabled=true
        connect('affirm.send',{to:x.id,label:label}).then(function(res){
          if(res.status===200){close();toast('Sent to '+x.name+'.');cache.inbox=null;render()}
          else{send.disabled=false;msg.className='msg bad';msg.textContent=res.body.error==='already_sent_today'?'You have already sent '+x.name+' one today.':res.body.error==='daily_limit'?'That is the most you can send in one day.':res.status===404?x.name+' is no longer available.':'That did not send. Please try again.'}
        }).catch(function(){send.disabled=false;msg.className='msg bad';msg.textContent='That did not send. Please try again.'})
      })
    })
  }
  function safetySheet(x){
    sheet(x.name,function(body,close){
      body.appendChild(el('p',{class:'sub',text:'You can hide '+x.name+' from you, or report them to the team. They are never told.'}))
      var block=el('button',{type:'button',class:'btn block ghost',style:'margin-top:16px',text:'Block '+x.name})
      block.addEventListener('click',function(){block.disabled=true;connect('block',{profile:x.id}).then(function(){close();toast(x.name+' is blocked.');cache.inbox=null;render();refreshPending()})})
      body.appendChild(block)
      body.appendChild(el('p',{class:'field',style:'margin-bottom:8px',text:'Report'}))
      var chips=el('div',{class:'chips'})
      ;[['uncomfortable','Made me uncomfortable'],['behaviour','Behaviour felt wrong'],['fake','Looks like a fake profile'],['other','Something else']].forEach(function(r){var b=el('button',{type:'button',class:'chip',text:r[1]});b.addEventListener('click',function(){chips.querySelectorAll('button').forEach(function(c){c.disabled=true});connect('report',{profile:x.id,reason:r[0]}).then(function(){close();toast('Thank you. The team has been told.');cache.inbox=null;render()})});chips.appendChild(b)})
      body.appendChild(chips)
    })
  }
  function refreshPending(){
    if(!state.features.people||!state.profile||!state.profile.discoverable){cache.pending=0;return Promise.resolve()}
    return connect('inbox').then(function(res){
      if(res.status!==200)return
      cache.inbox=res.body.items
      var n=res.body.items.filter(function(i){return (i.direction==='in'&&i.status==='sent')||(i.meetup&&i.meetup.status==='proposed'&&!i.meetup.byMe)}).length
      if(n!==cache.pending){cache.pending=n;render()}
    }).catch(function(){})
  }
  function loadInbox(box){
    box.appendChild(el('p',{class:'sub',text:'Loading...'}))
    connect('inbox').then(function(res){
      box.innerHTML=''
      if(res.status!==200){box.appendChild(el('div',{class:'empty'},[el('b',{text:'We could not load this'}),el('span',{text:'Please try again in a moment.'})]));return}
      var items=res.body.items;cache.inbox=items
      if(!items.length){box.appendChild(el('div',{class:'empty'},[el('b',{text:'No compliments yet'}),el('span',{text:'When someone sends you one, it will appear here. You can send one from Discover.'})]));return}
      items.forEach(function(i){box.appendChild(thread(i))})
    }).catch(function(){})
  }
  function thread(i){
    var inn=i.direction==='in',kids=[]
    var line=inn?i.other.name+' says “'+i.label+'”':'You sent '+i.other.name+' “'+i.label+'”'
    kids.push(el('div',{class:'row'},[avatar(i.other.avatar,i.other.name,'sm'),el('div',{class:'grow'},[el('strong',{text:line}),el('span',{class:'sub',text:inn?(i.status==='sent'?'New':'You said thanks'):(i.status==='acknowledged'?i.other.name+' said thanks':'Waiting for a reply')})])]))
    function act(label,cls,fn){var b=el('button',{type:'button',class:'btn small '+(cls||''),text:label});b.addEventListener('click',function(){b.disabled=true;fn().then(function(){cache.inbox=null;render();refreshPending()})});return b}
    var actions=el('div',{class:'row wrap'})
    if(inn&&i.status==='sent'){actions.appendChild(act('Say thanks','',function(){return connect('affirm.respond',{id:i.id,response:'acknowledge'})}));actions.appendChild(act('Not now','ghost',function(){return connect('affirm.respond',{id:i.id,response:'ignore'})}))}
    if(i.status==='acknowledged'){
      if(!i.meetup||i.meetup.status==='declined'){var m=el('button',{type:'button',class:'btn small accent',text:'Suggest meeting up'});m.addEventListener('click',function(){placeSheet(i)});actions.appendChild(m)}
      else if(i.meetup.status==='proposed'&&!i.meetup.byMe){kids.push(el('p',{class:'sub',style:'margin:0',text:i.other.name+' suggests: '+i.meetup.place}));actions.appendChild(act('Sounds good','',function(){return connect('meet.respond',{id:i.meetup.id,response:'accept'})}));actions.appendChild(act('Not this time','ghost',function(){return connect('meet.respond',{id:i.meetup.id,response:'decline'})}))}
      else if(i.meetup.status==='proposed'){kids.push(el('p',{class:'sub',style:'margin:0',text:'You suggested: '+i.meetup.place+'. Waiting for '+i.other.name+'.'}))}
      else if(i.meetup.status==='accepted'){kids.push(el('p',{class:'sub',style:'margin:0;color:var(--ok);font-weight:600',text:'It is on: '+i.meetup.place+'. Look out for '+i.other.name+'.'}))}
    }
    if(actions.firstChild)kids.push(actions)
    return el('div',{class:'thread'},kids)
  }
  function placeSheet(i){
    sheet('Suggest a place',function(body,close){
      var place=null,msg=el('p',{class:'msg',role:'status'})
      body.appendChild(el('p',{class:'sub',text:'Public places and activities only. '+i.other.name+' can accept or decline.'}))
      var chips=el('div',{class:'chips',style:'margin-top:14px',role:'radiogroup','aria-label':'Place'})
      state.connect.places.forEach(function(p){var b=el('button',{type:'button',class:'chip',role:'radio','aria-checked':'false',text:p.label});b.addEventListener('click',function(){place=p.id;chips.querySelectorAll('.chip').forEach(function(c){c.setAttribute('aria-checked',String(c===b))})});chips.appendChild(b)})
      var send=el('button',{type:'button',class:'btn block',style:'margin-top:18px',text:'Send suggestion'})
      body.appendChild(chips);body.appendChild(send);body.appendChild(msg)
      send.addEventListener('click',function(){
        if(!place){msg.className='msg bad';msg.textContent='Choose a place first.';return}
        send.disabled=true
        connect('meet.propose',{affirmationId:i.id,place:place}).then(function(res){
          if(res.status===200){close();toast('Suggestion sent.');cache.inbox=null;render()}
          else{send.disabled=false;msg.className='msg bad';msg.textContent=res.body.error==='proposal_open'?'There is already a suggestion waiting.':'That did not send. Please try again.'}
        }).catch(function(){send.disabled=false;msg.className='msg bad';msg.textContent='That did not send. Please try again.'})
      })
    })
  }

  /* ---------- App ---------- */
  function render(){
    var ship=state.venueType==='ship',name=state.firstName
    var ids=tabsFor().map(function(x){return x.id});if(ids.indexOf(tab)<0)tab='today'
    var heading,sub
    if(tab==='today'){heading=name?'Welcome, '+name:(ship?'Welcome aboard':'Welcome');sub=ship?'Everything for your voyage, in one place.':'Everything for your stay, in one place.'}
    else if(tab==='people'){heading='People';sub=null}
    else if(tab==='crew'){heading=ship?'Your crew':'Your team';sub='A word of thanks goes a long way.'}
    else if(tab==='rate'){heading='How are we doing?';sub=null}
    else{heading='Help';sub=null}
    var view=tab==='people'?viewPeople():tab==='crew'?viewCrew():tab==='rate'?viewRate():tab==='help'?viewHelp():viewToday()
    shell(view,heading,sub)
  }
  function failure(text){root.innerHTML='';root.appendChild(el('main',{class:'app'},[el('div',{class:'top'},[el('p',{class:'kicker',text:'Tisonik'}),el('h1',{text:'This page is not open'}),el('p',{class:'lead',text:text})])]))}
  var lastPoll=0
  function poll(){
    if(document.hidden||!state||Date.now()-lastPoll<4000)return
    lastPoll=Date.now()
    api('session',{token:token}).then(function(res){
      if(res.status!==200)return
      var before=(state.live||[]).map(function(x){return x.id}).join()
      state.offers=res.body.offers;state.live=res.body.live
      var after=(state.live||[]).map(function(x){return x.id}).join()
      if(tab!=='today'||document.querySelector('.scrim'))return
      if(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName))return
      if(after!==before&&state.live.length)toast('New: '+state.live[0].title)
      render()
    }).catch(function(){})
  }
  function open(){
    return api('session',{token:token}).then(function(res){
      if(res.status===200){state=res.body;document.documentElement.setAttribute('data-venue',state.venueType==='ship'?'ship':'hotel');(state.today||{}).pulses&&(today.pulses=state.today.pulses);(state.today||{}).recognised&&(today.recognised=state.today.recognised);render();refreshPending();setInterval(poll,60000);window.addEventListener('focus',poll);document.addEventListener('visibilitychange',poll)}
      else failure(again)
    })
  }
  // Swap the short-lived link in the address for a private cookie, then take it out of the address bar.
  var start=token?api('exchange',{token:token}).then(function(res){
    if(res.status===200){try{history.replaceState(null,'',location.pathname)}catch(e){}}
    else if(res.status===401){token=undefined}
  }):Promise.resolve()
  start.then(open).catch(function(){failure('We could not reach the service. Please try again in a moment.')})
})()
